spring:
  profiles:
    active: dev,real-kis
  application:
    name: magicjar-consumer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magicjar}
    username: ${DB_USER:magicjar}
    password: ${DB_PASSWORD:magicjar}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false  # api 모듈만 Flyway 실행 (ADR 0006 §마이그레이션)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: magicjar-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: RECORD
      concurrency: 1
    # kafka.api.evt.system.kis-key.changed.v1 consumer group (ADR 0074 Phase 3)
    # groupId: magicjar-consumer-system (SystemKisKeyChangedListener @KafkaListener 설정)
    # 기본 kafkaListenerContainerFactory 재사용 — 별도 factory 신규 0
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8082
  shutdown: graceful

# ADR 0094 P0-OPS-2 — Actuator/Prometheus 노출 (3 모듈 정합 LOCK)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers, env
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}

magicjar:
  mode: ${MAGICJAR_MODE:MOCK}
  allow-real: ${MAGICJAR_ALLOW_REAL:false}
  # 발굴 → MOCK 페이퍼 트레이딩 (ADR 0122) — PaperCapitalSnapshotProvider 가상 자본 초기 default.
  daytrade:
    paper:
      default-capital-krw: ${MAGICJAR_DAYTRADE_PAPER_DEFAULT_CAPITAL_KRW:10000000}
  # A 의제 hotfix (2026-05-20) — PositionBootstrapRunner trigger 조건 3중 게이트.
  # bootstrap.position-on-startup=false 시 부팅 시 KIS 호출 0 (KillSwitch ON risk 0).
  # default true — 회귀 안전. dev/staging 환경은 magicjar.mode=MOCK 또는 allow-real=false 로 자동 skip.
  bootstrap:
    position-on-startup: ${MAGICJAR_BOOTSTRAP_POSITION_ON_STARTUP:true}
  # 시그널·주문 게이트 (2026-06-04 dogfooding 결함 fix — 장운영시간 게이트).
  #   market-hours-gate.enabled=true (default) — 시그널 평가(RealtimeSignalGenerator)와
  #     AUTO 주문 dispatch(OrderRouterKafkaListener) 를 영업일+정규장(09:00~15:30 KST) 안에서만 진행.
  #   08:00~09:00 NXT pre-hour 캔들(정책상 의도된 적재)로 장전 시그널 발화·KIS 주문 거부 사태를 차단한다.
  #   MANUAL 주문은 게이트 제외(사용자 의도 존중). rollback: false 로 게이트 비활성.
  signal:
    market-hours-gate:
      enabled: ${MAGICJAR_SIGNAL_MARKET_HOURS_GATE_ENABLED:true}
      # ADR 0114 §4-4 P4 — SELL(보유 청산) 평가의 market-hours gate 분리.
      #   true(default): 현행대로 SELL 평가도 정규장(09:00~15:30)만. NXT 유동성 얇음 보수.
      #   false: NXT 시간대(08~09시·15:30~20시) 보유 포지션 SELL(손절/익절) 평가 허용(시간대 무관). BUY는 항상 게이트.
      #   사용자가 NXT 유동성·종목 특성 보고 전환(ADR §9 U-9 — 운영 데이터 후 결재).
      sell-enabled: ${MAGICJAR_SIGNAL_MARKET_HOURS_GATE_SELL_ENABLED:true}
    fallback-buy:
      default-enabled: ${MAGICJAR_SIGNAL_FALLBACK_BUY_DEFAULT_ENABLED:true}
      cache-ttl-ms: ${MAGICJAR_SIGNAL_FALLBACK_BUY_CACHE_TTL_MS:5000}
  # ADR 0114 §3·§5·§10-5 — 진입(BUY) 집행 정책 전역 default (전략별 entry_policy JSONB 미설정 시 적용).
  #   marketable limit 진입: 매도1호가에 걸되 상한(기준가 × (1+max-slippage-pct/100)) 초과면 스킵(시장가 fallback 0).
  #   미체결: timeout-sec 경과 시 취소(시장가 전환 금지·재시도 0). 스프레드 max-spread-pct 초과 진입 금지.
  order:
    entry:
      # opt-in 게이트(자본 경로 회귀 hotfix 2026-06-08) — entry_policy 없는 전략에도 marketable-limit을 전역 적용할지.
      #   default false = 현행 MARKET 보존. 전략별 entry_policy(JSONB) 명시 행은 본 toggle과 무관하게 항상 marketable-limit 적용.
      #   false + entry_policy 없음 → MARKET 주문(호가 조회 0 · NO_QUOTE 스킵 0). true → 전 전략 marketable-limit(호가 필요).
      limit-enabled: ${MAGICJAR_ORDER_ENTRY_LIMIT_ENABLED:false}
      max-slippage-pct: ${MAGICJAR_ORDER_ENTRY_MAX_SLIPPAGE_PCT:0.2}
      timeout-sec: ${MAGICJAR_ORDER_ENTRY_TIMEOUT_SEC:15}
      max-spread-pct: ${MAGICJAR_ORDER_ENTRY_MAX_SPREAD_PCT:0.3}
      # 미체결 진입 취소 워커(EntryTimeoutCancelWorker) toggle — default 활성. false면 미체결 LIMIT 자동 취소 0(수동 취소만).
      cancel-worker:
        enabled: ${MAGICJAR_ORDER_ENTRY_CANCEL_WORKER_ENABLED:true}
    # ADR 0115 §P2-4 — ACK 정체(WS 체결통보 누락) 주문 timeout 재조회 워커(StuckAckExecutionResyncWorker).
    #   ACK/PARTIALLY_FILLED 상태가 stale-threshold-seconds 넘게 정체하면 KIS 당일체결 대조로 FILLED/취소 정정.
    #   enabled=false 면 재연결 트리거 backfill(#815)만 의존(현행). PENDING_RECONCILE은 OrderReconciliationWorker 별도 책임.
    ack-resync:
      enabled: ${MAGICJAR_ORDER_ACK_RESYNC_ENABLED:true}
      stale-threshold-seconds: ${MAGICJAR_ORDER_ACK_RESYNC_STALE_THRESHOLD_SECONDS:180}
    # ADR 0115 §2-P2-② — terminal(특히 CANCELLED) 주문이라도 KIS 일별체결 totCcldQty 가 기록된 체결을 초과하면 흡수.
    #   취소-체결 race(시스템 CANCELLED·KIS 실체결, G5 11주 영구 미기록) 차단. execution INSERT 는 status 와 독립, status 는 보존.
    #   false → 현행 terminal skip(체결 누락 risk). 자본 audit 무결성(진실원 완전성 — 대안 B 전제).
    cancelled-fill-reconcile:
      enabled: ${MAGICJAR_ORDER_CANCELLED_FILL_RECONCILE_ENABLED:true}
    # canary D2 hotfix #1 — 만료 day-order 동기화 워커(ExpiredDayOrderSyncWorker).
    #   KIS 당일 LIMIT 주문(익절 SELL 등)이 장 마감으로 만료돼도 DB status=ACK 잔존 → 다음날 매도 시그널이
    #   "이미 정합 auto-tp open" 으로 오판해 청산 영구 skip(오늘 09:01~09:04 incident). 전일 이전 미종결(ACK/REQUESTED)
    #   day-order 를 KIS 일별체결 대조 후 만료(CANCELLED) 동기화한다. 30분 cron, 미종결 0건이면 즉시 종료.
    #   장마감+grace 이후에는 당일 정규장 day-order 도 만료 대조 대상에 포함한다(배포 drain ACK 잔류 방지).
    day-order-expiry:
      enabled: ${MAGICJAR_ORDER_DAY_ORDER_EXPIRY_ENABLED:true}
      market-close-grace-minutes: ${MAGICJAR_ORDER_DAY_ORDER_EXPIRY_MARKET_CLOSE_GRACE_MINUTES:20}
  # 분할매수(scale-in) / 분할익절 "리플레이 먼저" 게이트 (spec §8-1 · ADR 0111 §2-7).
  #   default false — toggle OFF면 RealtimeSignalGenerator가 scaleIn/partialExits 설정 전략도 현행 단일
  #   진입 + 전량 익절 경로로 평가(ScaleInExitCalculator 미사용). qa 2라운드 GREEN(PR #750·#753)으로 2026-06-05 default true 영구화.
  #   ACTIVE 전이 차단은 api StrategyService(SCALE_IN_NOT_ENABLED)가 별도로 막는다(자본 경로 원천 차단).
  strategy:
    scale-in:
      enabled: ${MAGICJAR_STRATEGY_SCALE_IN_ENABLED:true}
  # ADR 0114 R2-C2b — 청산 "항상" 보장 안전망 (시그널 경로 우회).
  #   stop-loss.tick-watch-enabled : kafka.consumer.evt.market.tick.v1 직접 listen → 보유분 손절 MARKET 안전망(P1·P2·P4 구조적 해소).
  #     인메모리 보유 인덱스(index-refresh-ms 주기 + 체결 즉시 갱신)로 매 tick DB 조회 0. false면 1m 경로 손절만(안전망 비활성).
  #   exit.take-profit-limit-enabled: BUY 체결 즉시 익절 LIMIT 선주문(시스템 다운 중에도 KIS 서버에 익절 유지). scale-in 평단 변동 시 재발행.
  #   take-profit.tick-watch-enabled : kafka.consumer.evt.market.tick.v1 직접 listen → 익절가 도달 시 MARKET SELL 안전망(canary D2 hotfix B).
  #     익절 LIMIT 당일 만료 후에도 가격이 익절가 이상이면 시그널 의존 없이 익절을 보장(손절 watcher 대칭). open auto-tp LIMIT 살아 있으면 미발사(중복 매도 방지).
  #     false면 현행(시그널 의존 익절)으로 회귀. idemKey 에 KST 날짜 차원 포함(REJECTED 후 영구 차단 F1 회피).
  #   holding-watch.enabled        : 보유 종목 HOLDING owner KIS WS 구독 보장(evict 절대 금지 — 청산 재료 공백 0).
  autotrading:
    stop-loss:
      tick-watch-enabled: ${MAGICJAR_AUTOTRADING_STOP_LOSS_TICK_WATCH_ENABLED:true}
      index-refresh-ms: ${MAGICJAR_AUTOTRADING_STOP_LOSS_INDEX_REFRESH_MS:60000}
      # ADR 0115 §P2-1 — auto-sl intent 발행 후 같은 포지션 상태에 대해 재발행 차단 쿨다운(초). 상태(수량/갱신시각) 변화 시 즉시 해제.
      #   매 tick 손절 intent 폭주(IDEMPOTENCY_SKIPPED 4,920건/30분 incident) 원천 차단. 0이면 현행(매 tick 발행).
      tick-cooldown-seconds: ${MAGICJAR_AUTOTRADING_STOP_LOSS_TICK_COOLDOWN_SECONDS:30}
    take-profit:
      tick-watch-enabled: ${MAGICJAR_TAKE_PROFIT_TICK_WATCHER_ENABLED:true}
    exit:
      take-profit-limit-enabled: ${MAGICJAR_AUTOTRADING_EXIT_TAKE_PROFIT_LIMIT_ENABLED:true}
    # ADR 0115 §P1-2 — backfill/복구가 재발행한 kafka.consumer.evt.order.filled.v1 replay 식별 신선도 임계(초).
    #   executedAt이 평가시각 대비 이 초 초과 과거면 복구 체결로 보고 익절 TP 미발행(중복 익절 차단). fillSource=REST_BACKFILL 1차 식별의 fail-safe.
    replay:
      freshness-threshold-seconds: ${MAGICJAR_AUTOTRADING_REPLAY_FRESHNESS_THRESHOLD_SECONDS:120}
    holding-watch:
      enabled: ${MAGICJAR_AUTOTRADING_HOLDING_WATCH_ENABLED:true}
      refresh-delay-ms: ${MAGICJAR_AUTOTRADING_HOLDING_WATCH_REFRESH_DELAY_MS:60000}
  # ADR 0115 §P1-1 — strategy_position 드리프트 자동 보정. sum(strategy_position) > position(KIS 권위)면 초과분 내림 정렬.
  #   유령 수량(7 vs 5 incident) 유령 매도 폭주의 뿌리 차단. false면 현행 WARN-only(보정 안 함). realized_pnl 불변(수량 정렬만).
  position:
    drift-auto-correct:
      enabled: ${MAGICJAR_POSITION_DRIFT_AUTO_CORRECT_ENABLED:true}
    # ADR 0115 §2-P2 R1 — strategy_position 을 order_execution(진실원) 파생 재계산 뷰로 reconcile(대안 B-on-A 1급).
    #   reconcile 주기에 rebuild + KIS 권위 교차검산(totalQuantity==position) 일치 시만 upsert. 부분체결 N건 정확 N회 귀속(G4).
    #   false → 현행 증분+drift 보정 경로로 회귀(rebuild no-op). 교차검산 불일치·over-sell clamp 면 미적용(KIS 권위 우선).
    ledger-rebuild:
      enabled: ${MAGICJAR_POSITION_LEDGER_REBUILD_ENABLED:true}
  # ADR 0115 §P2-2 — 같은 전략·종목 SELL 거부 N회 누적 시 전략 자동 정지(autoDisable) + 1회 알림(rate limiter 디바운스).
  #   정지는 drift 자동보정(P1-1)이 정합 회복하면 자연 해소, 사용자가 재활성화. 0이면 자동정지 비활성.
  notification:
    reject-auto-pause:
      threshold: ${MAGICJAR_NOTIFICATION_REJECT_AUTO_PAUSE_THRESHOLD:10}
  # ADR 0109 — REAL canary 전용 hard cap (RiskConfig·전략 설정과 독립된 마지막 자본 안전선).
  #   REAL 모드 + 각 값 > 0 일 때만 활성 (fail-open: 0/미설정 = 비활성 = 일반 REAL 운용). MOCK은 항상 비활성.
  #   초과 시 OrderRouter REJECTED + audit(reason=CANARY_*_CAP). canary 종료 후 ENV 제거로 즉시 비활성.
  #   max-order-qty           : 주문 1건 수량 절대 상한
  #   max-order-notional-krw  : 주문 1건 notional(qty × price) 절대 상한 (price: LIMIT=limitPrice, MARKET=priceAtSignal)
  #   max-orders-per-day      : 당일(KST) REAL 주문 횟수 전역 상한 (order_request DB 단일 권위 count)
  canary:
    max-order-qty: ${MAGICJAR_CANARY_MAX_ORDER_QTY:0}
    max-order-notional-krw: ${MAGICJAR_CANARY_MAX_ORDER_NOTIONAL_KRW:0}
    max-orders-per-day: ${MAGICJAR_CANARY_MAX_ORDERS_PER_DAY:0}
  # magicjar.ai.* — W4 진입(T-AI) 이후 consumer 코멘트 dispatcher/adapter 가 사용.
  #   대부분의 provider 키(anthropic/gemini/openai)는 adapter @Value 인라인 default 로 binding —
  #   본 yml 에는 claude-cli provider(키 불요·구독 기반 Claude CLI/bridge) 전용 설정만 명시한다.
  #   provider 선택은 MAGICJAR_AI_PROVIDER (default anthropic — 현행 동작 보존). 운영 전환은 orchestrator 가 .env 로.
  ai:
    # provider 선택: anthropic(default) | gemini | openai | claude-cli
    provider: ${MAGICJAR_AI_PROVIDER:anthropic}
    # mock 분기: auto(키 없으면 mock — claude-cli 는 키 불요라 제외) | mock(강제) | real(키 필수)
    mock-mode: ${MAGICJAR_AI_MOCK_MODE:auto}
    # claude-cli provider (ADR 0112 발굴 bridge 재사용 — 2026-06-08 종목상세 차트해석 연동)
    #   bridge-url 설정 시: POST {bridge-url}/discover (발굴과 동일 bridge 공유 가능)
    #   bridge-url 미설정 시: 로컬 `claude -p` CLI 직접 실행 (command 로 바이너리 경로 override)
    claude-cli:
      command: ${MAGICJAR_AI_CLAUDE_CLI_COMMAND:claude}
      bridge-url: ${MAGICJAR_AI_CLAUDE_CLI_BRIDGE_URL:}
      timeout-seconds: ${MAGICJAR_AI_CLAUDE_CLI_TIMEOUT_SECONDS:300}
  secret:
    master-key: ${MAGICJAR_SECRET_MASTER_KEY:}  # AES-256-GCM KIS 키 복호화. 부재 시 부팅 거부
  kis:
    base-url-prod: ${MAGICJAR_KIS_BASE_URL_PROD:https://openapi.koreainvestment.com:9443}
    base-url-vps: ${MAGICJAR_KIS_BASE_URL_VPS:https://openapivts.koreainvestment.com:29443}
    # KIS WebSocket URL — ws:// (비암호화 WebSocket)
    # KIS-first 출처: kis_devlp.yaml ops="ws://ops.koreainvestment.com:21000" (SSL 없음)
    # https://raw.githubusercontent.com/koreainvestment/open-trading-api/main/kis_devlp.yaml
    # 주의: KIS WS 서버는 ws:// 사용. wss:// 연결 시 SSL handshake timeout 발생.
    ws:
      url-prod: ${MAGICJAR_KIS_WS_URL_PROD:ws://ops.koreainvestment.com:21000}
      url-vps: ${MAGICJAR_KIS_WS_URL_VPS:ws://ops.koreainvestment.com:31000}
      user-id: ${MAGICJAR_KIS_WS_USER_ID:}       # KIS WS approval_key 발급 사용자 ID
      heartbeat-timeout-seconds: ${MAGICJAR_KIS_WS_HEARTBEAT_TIMEOUT:10}
      polling-fallback-timeout-seconds: ${MAGICJAR_KIS_WS_POLLING_FALLBACK_TIMEOUT:30}
      # 종목별 무tick watchdog 임계(초) — SUBSCRIBE SUCCESS 후 이 시간 동안 H0UNCNT0 체결 tick 0건이면
      # WARN(silent 누락 차단 §11-2 — 2026-06-15 403870 silent 누락 결함 ②). 정규장(08:00~20:00 KST)만 점검.
      # 0 이하면 watchdog 비활성(롤백 toggle).
      no-tick-watchdog-seconds: ${MAGICJAR_KIS_WS_NO_TICK_WATCHDOG_SECONDS:120}
      # watchlist 시세 5초 REST polling 폐지 (ADR 0124 amend · 2026-06-15 최고 관리자 결재).
      #   기존 throttle 설정(max-codes-per-tick·inter-call-delay-ms·rate-limit-cooldown-ms)은 worker 가
      #   더 이상 KIS REST 를 호출하지 않으므로 제거했다. watchlist 화면 시세 polling 은 KIS quota(EGW00201)
      #   순수 낭비로 결재돼 자동 조회 책임이 폐지됐다. watchlist 등록/삭제/priority 기능은 유지.
      # ADR 0123 R1 — KIS WS 구독 슬롯 단일 회계기 (WsSlotBudgetLedger).
      # max-slots: KIS 동시 구독 한도 (KIS-first kis_auth.py __runner() enforce 값 40, 상수 아닌 설정).
      #   KIS-first raw: https://raw.githubusercontent.com/koreainvestment/open-trading-api/main/examples_user/kis_auth.py
      # slot-ledger.enabled=false 시 회계 no-op → 현행 동작 회귀 (롤백 toggle).
      max-slots: ${MAGICJAR_KIS_WS_MAX_SLOTS:40}
      slot-ledger:
        enabled: ${MAGICJAR_KIS_WS_SLOT_LEDGER_ENABLED:true}
      # 호가(H0UNASP0) 구독은 STRATEGY(전략 ACTIVE) + DETAIL(종목 상세 표시 중) 두 owner로 수립된다
      #   (anchor `detail-orderbook-live-only`). DETAIL은 진입 즉시 구독·이탈 즉시 해제(LRU slot 예산 불필요 —
      #   표시 중 1종목만 점유) + EXIT 누락 대비 15분 idle 안전망. STRATEGY는 registrar TTL이 관리. 별도 slot 예산 없음.
      # admin-status: 관리자 실시간 구독 상태 스냅샷 발행 주기(ms) — Redis `admin:realtime-status` (anchor `admin-realtime-status`).
      #   read-only 관측 발행(구독/매매 로직 무관). api stale 판정 임계 15초보다 충분히 촘촘(기본 5초).
      admin-status:
        publish-interval-ms: ${MAGICJAR_KIS_WS_ADMIN_STATUS_PUBLISH_INTERVAL_MS:5000}
    # KIS REST rate limiter — api·batch·consumer 동일 Redis 버킷 share (ADR 0116 Phase 2 3-tier).
    # interval refill로 burst를 완화해 EGW00201 빈도를 낮춘다.
    rate-limiter:
      enabled: ${MAGICJAR_KIS_RATE_LIMIT_ENABLED:true}
      bucket-capacity: ${MAGICJAR_KIS_RATE_LIMIT_BURST:10}
      bucket-refill-tokens: 10
      # ADR 0116 §2-B priority별 별도 버킷 (USER 4 / SHARED 3 / BG 3 = 합 10) — api·batch 동일 LOCK.
      priority-buckets-enabled: ${MAGICJAR_KIS_PRIORITY_BUCKETS_ENABLED:true}
      bucket-user: ${MAGICJAR_KIS_BUCKET_USER:4}       # USER_PATH 1차 (본주문·현재가·잔고)
      bucket-realtime-market: ${MAGICJAR_KIS_BUCKET_REALTIME_MARKET:2} # ACTIVE 전략 degraded 시세 보강
      bucket-shared: ${MAGICJAR_KIS_BUCKET_SHARED:2}   # INGESTION 1차 (approval·watchlist)
      bucket-bg: ${MAGICJAR_KIS_BUCKET_BG:2}           # BACKFILL·INGESTION_LOW 1차
      # deprecated (ADR 0116 — priority-buckets-enabled로 일반화). 하위호환 바인딩 보존.
      user-path-reserve-tokens: ${MAGICJAR_KIS_USER_PATH_RESERVE:3}
      bucket-refill-period-seconds: 1
      bucket-key: kis-rate-limit:global
      bucket-ttl-seconds: 10
      acquire-poll-interval-millis: 50
    balance-rate-limit-backoff-millis: ${MAGICJAR_KIS_BALANCE_RATE_LIMIT_BACKOFF_MS:1000}
    # F10 (2026-06-12) — 잔고조회 rate limit 시 backoff 재시도 횟수 (KIS per-TR 1/s 고려). 소진 시 stale-cache·skip.
    balance-rate-limit-max-retries: ${MAGICJAR_KIS_BALANCE_RATE_LIMIT_MAX_RETRIES:2}
    # v3.13.1 — 계좌 availability Redis snapshot guard.
    #   snapshot-guard-enabled=false(default): 기존 주문 path 그대로, Redis/KIS 추가 판단 0.
    #   true: 본주문 전 account:availability snapshot만 조회(KIS REST 호출 0). miss/stale/불명확 값은 pass-through.
    #   reject-on-insufficient=true: fresh snapshot이 부족을 확정할 때만 REJECTED 처리.
    account-availability:
      snapshot-guard-enabled: ${MAGICJAR_KIS_ACCOUNT_AVAILABILITY_SNAPSHOT_GUARD_ENABLED:false}
      reject-on-insufficient: ${MAGICJAR_KIS_ACCOUNT_AVAILABILITY_REJECT_ON_INSUFFICIENT:false}
      max-age-seconds: ${MAGICJAR_KIS_ACCOUNT_AVAILABILITY_MAX_AGE_SECONDS:300}
      snapshot-ttl-seconds: ${MAGICJAR_KIS_ACCOUNT_AVAILABILITY_SNAPSHOT_TTL_SECONDS:900}
      refresh-enabled: ${MAGICJAR_KIS_ACCOUNT_AVAILABILITY_REFRESH_ENABLED:false}
      refresh-fixed-delay-ms: ${MAGICJAR_KIS_ACCOUNT_AVAILABILITY_REFRESH_DELAY_MS:300000}
      refresh-debounce-ms: ${MAGICJAR_KIS_ACCOUNT_AVAILABILITY_REFRESH_DEBOUNCE_MS:2000}
    # 2026-06-15 — 자동매매 계좌 스냅샷 cache-aside + singleflight.
    # 같은 userId+accountType 잔고조회가 동시에 몰리면 KIS inquire-balance 1회로 수렴하고,
    # 주문/체결/취소/거부 이벤트는 account:balance cache 를 즉시 dirty 처리한다.
    account-snapshot:
      cache-ttl-seconds: ${MAGICJAR_KIS_ACCOUNT_SNAPSHOT_CACHE_TTL_SECONDS:300}
      lock-ttl-seconds: ${MAGICJAR_KIS_ACCOUNT_SNAPSHOT_LOCK_TTL_SECONDS:12}
      lock-wait-millis: ${MAGICJAR_KIS_ACCOUNT_SNAPSHOT_LOCK_WAIT_MS:50}
      lock-wait-max-millis: ${MAGICJAR_KIS_ACCOUNT_SNAPSHOT_LOCK_WAIT_MAX_MS:10000}
    execution-sync:
      fresh-window-seconds: ${MAGICJAR_KIS_EXECUTION_SYNC_FRESH_WINDOW_SECONDS:30}
      failure-cooldown-seconds: ${MAGICJAR_KIS_EXECUTION_SYNC_FAILURE_COOLDOWN_SECONDS:10}
  # F10 (2026-06-12) — 주문경로 capital 산출 정책. 조회 실패 시 직전 성공 잔고(stale)를 이 TTL 내에서 재사용(0 fabricate 금지).
  # 2026-06-15 REAL 보강 — 직전 성공 잔고가 아주 최근이면 KIS 원장 직접 조회를 생략해 1분 신호의 EGW00215 자가압박을 줄인다.
  # 0 이하면 fresh-cache reuse 비활성(항상 KIS 직접 조회).
  risk:
    capital-stale-cache-ttl-minutes: ${MAGICJAR_RISK_CAPITAL_STALE_CACHE_TTL_MINUTES:5}
    capital-fresh-cache-reuse-seconds: ${MAGICJAR_RISK_CAPITAL_FRESH_CACHE_REUSE_SECONDS:90}
    # KIS capital direct 조회 실패 직후 같은 endpoint 를 매분 재시도하지 않도록 짧게 식힌다. 0 이하면 비활성.
    capital-direct-failure-cooldown-seconds: ${MAGICJAR_RISK_CAPITAL_DIRECT_FAILURE_COOLDOWN_SECONDS:120}
  # 2026-06-15 REAL 장중: 1분 신호가 0초에 KIS USER 경로를 쓰므로 reconcile BACKFILL은 30초로 분산.
  reconcile:
    market-open-cron: "${MAGICJAR_RECONCILE_MARKET_OPEN_CRON:30 */5 9-15 * * MON-FRI}"
  # Yahoo Finance cold-start 설정 (ADR 0048 §2-7 + external-api-policy.md §3)
  yahoo:
    base-url: ${MAGICJAR_YAHOO_BASE_URL:https://query1.finance.yahoo.com}
    request-timeout-seconds: ${MAGICJAR_YAHOO_TIMEOUT:10}
    retry-wait-seconds: ${MAGICJAR_YAHOO_RETRY_WAIT:60}  # 429/404 시 대기
  # ─────────────────────────────────────────────────
  # 차트 캔들 페이지네이션 매트릭스 (ADR 0093 §3-1 LOCK · api 모듈 mirror)
  #   key 매트릭스 = api/application.yml 1:1 (spec PR #609 §5 정합)
  #   timeframe별 max-pages × KIS 100건/page = max 봉 cover
  #     1m=48(4800봉 chart fallback), 3m·5m·15m·30m·90m·1h=38(3800봉), 4h=20(2000봉), 12h=12(1200봉), 1d=50(5000봉),
  #     1wk=20(2000봉), 1mo=12(1200봉), 1y=6(600봉)
  #   ADR 0105: KIS FHKST03010230 1m 장기 backfill/reconciliation은 one-minute 설정 사용.
  #   default-max-pages: 누락 키 fallback (회귀 안전)
  # ─────────────────────────────────────────────────
  candle:
    max-pages-by-interval:
      "[1m]": 48
      "[3m]": 38
      "[5m]": 38
      "[15m]": 38
      "[30m]": 38
      "[90m]": 38
      "[1h]": 38
      "[4h]": 20
      "[12h]": 12
      "[1d]": 50
      "[1wk]": 20
      "[1mo]": 12
      "[1y]": 6
    default-max-pages: 6
    one-minute:
      default-lookback-trading-days: ${MAGICJAR_CANDLE_1M_DEFAULT_LOOKBACK_TRADING_DAYS:126}
      max-lookback-trading-days: ${MAGICJAR_CANDLE_1M_MAX_LOOKBACK_TRADING_DAYS:252}
      max-pages-per-day: ${MAGICJAR_CANDLE_1M_MAX_PAGES_PER_DAY:8}
    # 캔들 백필 rate-limit safety 가드 (2026-06-04 dogfooding fix — KIS 폭주·전건실패 무한재시도 차단)
    #   evidence: 부팅 시 8종목 1m 2일 stale → 백필 전건 실패(failed=5008/5008) → 매 부팅 재시도 → TPS_EXCEEDED 폭주
    #   - consecutive-total-miss-threshold: KIS 전건 미반환(0건) run 연속 N회 → 회복 불가 영구 마킹 + 재시도 중단
    #   - max-gaps-per-run: 1회 run당 처리 갭 상한 (초과분은 가장 최근 cap건 + 나머지 다음 사이클)
    #   - max-concurrent-backfills: 동시 백필 run 직렬화 (부팅 N종목 동시 폭주 차단)
    #   - min-interval-millis: 백필 run 간 최소 간격
    #   - unrecoverable-ttl-hours: 회복 불가 마킹 TTL (만료 후 1회 재확인 허용)
    backfill-guard:
      consecutive-total-miss-threshold: ${MAGICJAR_CANDLE_BACKFILL_MISS_THRESHOLD:2}
      max-gaps-per-run: ${MAGICJAR_CANDLE_BACKFILL_MAX_GAPS_PER_RUN:5000}
      max-concurrent-backfills: ${MAGICJAR_CANDLE_BACKFILL_MAX_CONCURRENT:1}
      min-interval-millis: ${MAGICJAR_CANDLE_BACKFILL_MIN_INTERVAL_MS:1500}
      acquire-timeout-millis: ${MAGICJAR_CANDLE_BACKFILL_ACQUIRE_TIMEOUT_MS:60000}
      guard-ttl-hours: ${MAGICJAR_CANDLE_BACKFILL_GUARD_TTL_HOURS:72}
      unrecoverable-ttl-hours: ${MAGICJAR_CANDLE_BACKFILL_UNRECOVERABLE_TTL_HOURS:168}
      # rate-limit circuit breaker (2026-06-05 readiness P0-1) — admin·auto 공통.
      #   evidence: admin 1m 8종목 연속 실행 시 tpsExceededCount 1→155→337.
      #   - circuit-consecutive-trips: KIS rate-limit 압박(전건 미반환) run 연속 N회 → circuit OPEN(다음 윈도 이월)
      #   - circuit-open-millis: circuit OPEN 유지(ms). 이 기간 throttle gate 진입 run 즉시 skip
      circuit-consecutive-trips: ${MAGICJAR_CANDLE_BACKFILL_CIRCUIT_TRIPS:3}
      circuit-open-millis: ${MAGICJAR_CANDLE_BACKFILL_CIRCUIT_OPEN_MS:60000}

  # MARKET_DAILY 10년 전종목 일봉 backfill 캠페인 (ADR 0118 R-BF)
  #   멱등 캠페인 — 매 run 호출이 progress(candle row 기반) 이어받아 미완료 종목만 cap까지 처리.
  #   enabled=false(default) 시 가동 0(중단=off, 적재분 보존). 트리거: POST /admin/market-daily-backfill/run.
  #   모든 KIS 콜 = BACKFILL(BG) 버킷 — USER_PATH·INGESTION 침범 0 (§5-1 LOCK).
  #   ⚠ full 75,000콜 완주는 여러 밤/주말 반복 호출 — 실 가동은 사용자 환경 + 명시 go 시점.
  market-daily-backfill:
    enabled: ${MAGICJAR_MARKET_DAILY_BACKFILL_ENABLED:false}
    history-years: ${MAGICJAR_MARKET_DAILY_BACKFILL_HISTORY_YEARS:10}
    nightly-call-cap: ${MAGICJAR_MARKET_DAILY_BACKFILL_NIGHTLY_CALL_CAP:6000}
    completion-min-rows: ${MAGICJAR_MARKET_DAILY_BACKFILL_COMPLETION_MIN_ROWS:200}
    recency-grace-days: ${MAGICJAR_MARKET_DAILY_BACKFILL_RECENCY_GRACE_DAYS:7}
    # fetch 했으나 max_ts 전진 0(KIS-unavailable·corporate action 미해소) 종목 재시도 cooldown 일수.
    # 0=cooldown 비활성(매 run 재시도). over-fetch 가드 — cooldown 만료 후 재진입(데이터 출현 시 복구).
    no-advance-cooldown-days: ${MAGICJAR_MARKET_DAILY_BACKFILL_NO_ADVANCE_COOLDOWN_DAYS:7}
    # 동시성 보강 (ADR 0118 amend §9-D) — coroutine Semaphore throughput shaping.
    #   KIS hard ceiling(초당 10건)은 ConsumerRedisKisRateLimiterAdapter(Bucket4j)가 별도 유효 — 세마포어가 우회/중복 0.
    concurrency: ${MAGICJAR_MARKET_DAILY_BACKFILL_CONCURRENCY:10} # 동시 처리 종목 수(1=직렬, 상한 32)
    launch-delay-ms: ${MAGICJAR_MARKET_DAILY_BACKFILL_LAUNCH_DELAY_MS:100} # 종목 launch 간 지연(ms) — burst 분산

  # MARKET_DAILY 저녁/장전 전종목 일봉 snapshot 스케줄러 (ADR 0118 R2)
  #   매 영업일 20:05 KST 당일, 08:05 KST 직전 영업일 멀티시세(FHKST11300006)로 1d 봉 upsert(DO UPDATE).
  #   DailyCloseFinalizer(20:10 WS 집계 INSERT DO NOTHING)는 R2 성공값을 덮지 않고 실패 시 managed 보조 경로가 된다.
  #   영업일 가드 + ENV kill-switch. 모든 KIS 콜 = BACKFILL(BG) 버킷 — USER_PATH·INGESTION 침범 0.
  market-daily-snapshot:
    enabled: ${MAGICJAR_MARKET_DAILY_SNAPSHOT_ENABLED:true}  # kill-switch (운영 점검 시 false)
    cron: ${MAGICJAR_MARKET_DAILY_SNAPSHOT_CRON:0 5 20 * * *} # 저녁 발사 cron (zone=Asia/Seoul 고정)
    pre-open-cron: ${MAGICJAR_MARKET_DAILY_SNAPSHOT_PRE_OPEN_CRON:0 5 8 * * *} # 장전 직전 영업일 재확정 cron
    chunk-spacing-ms: ${MAGICJAR_MARKET_DAILY_SNAPSHOT_CHUNK_SPACING_MS:120} # chunk 간 지연(ms) — burst 분산

  # MarketSession 설정 (ADR 0013 §2-2, PR-29a 본격 교체)
  session:
    # KIS chk-holiday(CTCA0903R) + market_calendar DB 기반 (KrxMarketSessionResolver)
    # consumer 모듈은 SimpleMarketSessionResolver(시간 기반 fallback) 사용
    check-interval-seconds: ${MAGICJAR_SESSION_CHECK_INTERVAL:60}
  # market_calendar 동기화 (ADR 0013 §2-2, PR-29a)
  market-calendar:
    # 부팅 직후 KIS chk-holiday sync 실행 (dev=true 권장, prd=false)
    sync-at-boot: ${MAGICJAR_MARKET_CALENDAR_SYNC_AT_BOOT:false}
    # DailyCloseFinalizer: 매 거래일 16:00 KST 1d candle DB 영속
    daily-close-cron: ${MAGICJAR_DAILY_CLOSE_CRON:0 0 16 * * *}
    # TickFallbackEmitter: 10초 주기 T2 폴백 (ADR 0014)
    tick-fallback-delay-ms: ${MAGICJAR_TICK_FALLBACK_DELAY_MS:10000}
  realtime-candle:
    degraded-poller:
      enabled: ${MAGICJAR_REALTIME_CANDLE_DEGRADED_POLLER_ENABLED:true}
      fixed-delay-ms: ${MAGICJAR_REALTIME_CANDLE_DEGRADED_POLLER_DELAY_MS:5000}
      initial-delay-ms: ${MAGICJAR_REALTIME_CANDLE_DEGRADED_POLLER_INITIAL_DELAY_MS:7000}
      stale-after-seconds: ${MAGICJAR_REALTIME_CANDLE_DEGRADED_POLLER_STALE_SECONDS:10}
      max-codes-per-cycle: ${MAGICJAR_REALTIME_CANDLE_DEGRADED_POLLER_MAX_CODES:30}


# ─────────────────────────────────────────────────
# 로깅 레벨 — 노이즈 차단 (v3.1.0 dogfooding hotfix)
# ─────────────────────────────────────────────────
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.apache.kafka: WARN
    org.apache.kafka.clients.NetworkClient: ERROR
    org.springframework.kafka: WARN
    kr.spdaewoon.magicjar: INFO
