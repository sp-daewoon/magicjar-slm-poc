[project]
name = "magicjar-slm-lab"
version = "0.1.0"
description = "magicJar SLM Lab — local RAG domain Q&A (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.12",
    "llama-index-llms-ollama>=0.5",
    "llama-index-embeddings-huggingface>=0.5",
    "llama-index-vector-stores-qdrant>=0.6",
    "qdrant-client>=1.12",
    "arize-phoenix>=7.0",
    "openinference-instrumentation-llama-index>=3.0",
    "opentelemetry-exporter-otlp>=1.27",
    "ragas>=0.2",
    "langchain-ollama>=0.2",
    "datasets>=3.0",
    "streamlit>=1.39",
    "pyyaml>=6.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: tests that require live infrastructure (Qdrant, Ollama, etc.)"]
